services:
  tutor:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /app/data/learning_tutor.db
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_TIMEOUT_SECONDS: 8
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
